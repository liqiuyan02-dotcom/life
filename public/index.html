      const ledgers = await DB.getAll('ledgers');
      ledger = ledgers[0];
      if (ledger) App.toast('将记入「' + ledger.name + '」账本');
    } else {
      ledger = await this.getCurrentLedger();
    }
    if (!ledger) { App.toast('请先创建账本'); return; }
    this._formLedgerId = ledger.id;

    const isEdit = !!editTx;
    const tx = editTx || {
      amount: '', categoryIdx: 0, payerIdx: 0,
      participantIdxs: ledger.members.map((_, i) => i),
      splitType: 'equal', splitRatios: {}, note: '', date: new Date().toISOString(),
      amountUnknown: false
    };

    // 时间选择框默认值（本地时间，datetime-local 格式）
    const d0 = new Date(tx.date || new Date().toISOString());
    const pad = n => String(n).padStart(2, '0');
    const defTimeVal = `${d0.getFullYear()}-${pad(d0.getMonth() + 1)}-${pad(d0.getDate())}T${pad(d0.getHours())}:${pad(d0.getMinutes())}`;

    let html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">${isEdit ? '编辑账目' : '记一笔'}</div>

      <div class="form-group">
        <label class="form-label">金额</label>
        <div class="segment" style="margin-bottom:8px">
          <div class="segment-item ${!tx.amountUnknown ? 'active' : ''}" onclick="Finance.toggleAmountUnknown(false, this)">已确定金额</div>
          <div class="segment-item ${tx.amountUnknown ? 'active' : ''}" onclick="Finance.toggleAmountUnknown(true, this)">金额未知</div>
        </div>
        <input class="form-input" type="number" id="txAmount" placeholder="0.00" step="0.01" value="${tx.amountUnknown ? '' : (tx.amount || '')}" ${tx.amountUnknown ? 'disabled' : ''} style="font-size:24px;font-weight:700;text-align:center">
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">选「金额未知」可先记账，稍后补全金额再清算</div>
      </div>

      <div class="form-group">
        <label class="form-label">分类</label>
        <div class="chip-group">
          ${this.txCategories.map((c, i) => `
            <div class="chip ${tx.categoryIdx === i ? 'active' : ''}" onclick="App.selectChip(this, 'txCategory', ${i})" data-idx="${i}">${c.icon} ${c.name}</div>
          `).join('')}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">备注</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input class="form-input" id="txNote" placeholder="写点什么..." value="${Utils.escape(tx.note || '')}" style="flex:1">
          <button type="button" class="photo-btn" onclick="Finance.attachPhoto()" title="拍照/上传照片留存">📷</button>
        </div>
        <div id="txPhotoPreview">${tx.photo ? `<div class="photo-preview"><img src="${tx.photo}" onclick="Finance.viewPhoto(this.src)"><button type="button" class="photo-remove" onclick="Finance.removePhoto()">✕</button></div>` : ''}</div>
      </div>

      <div class="form-group">
        <label class="form-label">付款人</label>
        <div class="chip-group">
          ${ledger.members.map((m, i) => `
            <div class="chip ${tx.payerIdx === i ? 'active' : ''}" onclick="App.selectChip(this, 'txPayer', ${i})" data-idx="${i}">${Utils.escape(m)}</div>
          `).join('')}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">参与人（分摊）</label>
        <div class="chip-group" id="txParticipants">
          ${ledger.members.map((m, i) => `
            <div class="member-chip ${tx.participantIdxs.includes(i) ? 'active' : ''}" onclick="App.toggleParticipant(this, ${i})" data-idx="${i}">
              ${Utils.escape(m)} <span class="check">${tx.participantIdxs.includes(i) ? '✓' : ''}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">分摊方式</label>
        <div class="segment" style="margin-bottom:0">
          <div class="segment-item ${tx.splitType === 'equal' ? 'active' : ''}" onclick="Finance.selectSplitType('equal',this)">平均分摊</div>
          <div class="segment-item ${tx.splitType === 'custom' ? 'active' : ''}" onclick="Finance.selectSplitType('custom',this)">自定义比例</div>
        </div>
      </div>

      <div class="form-group" id="splitRatioArea" style="display:${tx.splitType === 'custom' ? 'block' : 'none'}">
        <label class="form-label">分摊比例（仅参与人）</label>
        <div id="splitRatioList">
          ${(tx.participantIdxs && tx.participantIdxs.length ? tx.participantIdxs : []).map(i => `
            <div class="split-ratio-row">
              <span class="sr-name">${Utils.escape(ledger.members[i] || '?')}</span>
              <input type="number" value="${tx.splitRatios?.[i] ?? ''}" placeholder="0" step="0.1" data-member-idx="${i}" oninput="Finance.updateSplitRatio()">
              <span class="sr-unit">份</span>
            </div>
          `).join('')}
          ${(!tx.participantIdxs || tx.participantIdxs.length === 0) ? '<div style="font-size:13px;color:var(--text-light)">请先在上方选择参与人</div>' : ''}
        </div>
        <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">按比例分配，仅参与人之间分摊，无需加起来等于某个数</div>
      </div>

      <div class="form-group">
        <label class="form-label">记账时间</label>
        <input class="form-input" type="datetime-local" id="txDate" value="${defTimeVal}" style="font-size:16px">
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">默认定为当前时间，可手动修改</div>
      </div>

      <div class="action-row">
        ${isEdit ? '<button class="btn btn-danger" onclick="Finance.deleteTransaction(\'' + tx.id + '\')">删除</button>' : ''}
        <button class="btn btn-secondary" onclick="App.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="Finance.saveTransaction(${isEdit ? `'${tx.id}'` : 'null'})">保存</button>
      </div>
    `;

    App.openSheet(html);
    // 保存当前表单状态
    this._formLedger = ledger;
    this._formState = { categoryIdx: tx.categoryIdx, payerIdx: tx.payerIdx, participantIdxs: [...tx.participantIdxs], splitType: tx.splitType, amountUnknown: !!tx.amountUnknown, splitRatios: { ...(tx.splitRatios || {}) }, photo: tx.photo || null };
  },

  _formState: { categoryIdx: 0, payerIdx: 0, participantIdxs: [], splitType: 'equal', amountUnknown: false, photo: null },

  selectSplitType(type, el) {
    this._formState.splitType = type;
    el.parentElement.querySelectorAll('.segment-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('splitRatioArea').style.display = type === 'custom' ? 'block' : 'none';
  },

  toggleAmountUnknown(unknown, el) {
    this._formState.amountUnknown = unknown;
    el.parentElement.querySelectorAll('.segment-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    const inp = document.getElementById('txAmount');
    if (inp) {
      inp.disabled = unknown;
      if (unknown) inp.value = '';
    }
  },

  async saveTransaction(editId) {
    const fs = this._formState;
    const ledgerId = this._formLedgerId || (await this.getCurrentLedger())?.id;
    const ledger = await DB.get('ledgers', ledgerId);
    if (!ledger) { App.toast('请先选择账本'); return; }
    const note = document.getElementById('txNote').value.trim();
    const unknown = !!fs.amountUnknown;

    // 记账时间（用户可改；空则默认当前）
    const dateEl = document.getElementById('txDate');
    const date = (dateEl && dateEl.value) ? new Date(dateEl.value).toISOString() : new Date().toISOString();

    let amount = 0;
    if (!unknown) {
      amount = parseFloat(document.getElementById('txAmount').value);
      if (!amount || amount <= 0) { App.toast('请输入金额'); return; }
    }

    if (fs.participantIdxs.length === 0) { App.toast('请选择参与人'); return; }

    let splitRatios = {};
    if (fs.splitType === 'custom') {
      const inputs = document.querySelectorAll('#splitRatioList input');
      inputs.forEach(inp => {
        const idx = parseInt(inp.dataset.memberIdx);
        const val = parseFloat(inp.value);
        if (val && val > 0 && fs.participantIdxs.includes(idx)) splitRatios[idx] = val;
      });
      if (Object.keys(splitRatios).length === 0) { App.toast('请填写分摊比例'); return; }
    }

    // 编辑时保留原有的清算标记，未知/已知切换不清除已清算状态
    const existing = editId ? await DB.get('transactions', editId) : null;

    const txData = {
      id: editId || Utils.uid(),
      ledgerId: ledger.id,
      amount,
      amountUnknown: unknown,
      categoryIdx: fs.categoryIdx,
      payerIdx: fs.payerIdx,
      participantIdxs: fs.participantIdxs,
      splitType: fs.splitType,
      splitRatios,
      note,
      date,
      photo: fs.photo || null,
      settlementId: existing ? (existing.settlementId || null) : null
    };

    await DB.put('transactions', txData);
    App.closeSheet();
    App.toast(editId ? '已更新' : '已记账');
    this._txDirty = true;
    this.render();
    Home.render();
  },

  // ===== 记账照片留存 =====
  attachPhoto() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await this._compressImage(file);
        this._formState.photo = dataUrl;
        this._renderPhotoPreview(dataUrl);
        App.toast('照片已添加');
      } catch (err) {
        App.toast('照片处理失败：' + (err && err.message ? err.message : err));
      }
    };
    input.click();
  },

  _compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1080;
          const scale = Math.min(1, maxW / (img.width || maxW));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => reject(new Error('图片读取失败'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('文件读取失败'));
      reader.readAsDataURL(file);
    });
  },

  _renderPhotoPreview(dataUrl) {
    const box = document.getElementById('txPhotoPreview');
    if (!box) return;
    box.innerHTML = `
      <div class="photo-preview">
        <img src="${dataUrl}" onclick="Finance.viewPhoto(this.src)">
        <button type="button" class="photo-remove" onclick="Finance.removePhoto()">✕</button>
      </div>`;
  },

  removePhoto() {
    this._formState.photo = null;
    const box = document.getElementById('txPhotoPreview');
    if (box) box.innerHTML = '';
    App.toast('已移除照片');
  },

  viewPhoto(src) {
    App.openSheet(`
      <div class="sheet-handle"></div>
      <div class="photo-viewer-wrap"><img src="${src}" onclick="App.closeSheet()"></div>
    `);
  },

  async viewPhotoByTx(id) {
    const t = await DB.get('transactions', id);
    if (t && t.photo) { this.viewPhoto(t.photo); }
    else { App.toast('该笔账目没有照片'); }
  },

  async deleteTransaction(id) {
    App.confirm('确定删除这条记录？', async () => {
      await DB.delete('transactions', id);
      App.closeSheet();
      App.toast('已删除');
      this._txDirty = true;
      this.render();
      Home.render();
    });
  },

  // ===== 账本管理 =====
  async showAddLedger() {
    const html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">新建账本</div>
      <div class="form-group">
        <label class="form-label">账本名称</label>
        <input class="form-input" id="ledgerName" placeholder="如：旅行账本、家庭账本">
      </div>
      <div class="form-group">
        <label class="form-label">成员（用逗号分隔）</label>
        <input class="form-input" id="ledgerMembers" placeholder="如：我,小明,小红">
      </div>
      <div class="form-group">
        <label class="form-label">颜色</label>
        <div class="chip-group">
          ${this.ledgerColors.map((c, i) => `
            <div class="chip" onclick="App.selectChip(this,'ledgerColor',${i})" data-idx="${i}" style="${i===0?'background:'+c+';color:#fff':''}">
              <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${c}"></span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="action-row">
        <button class="btn btn-secondary" onclick="App.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="Finance.saveLedger()">创建</button>
      </div>
    `;
    this._newLedgerColor = 0;
    App.openSheet(html);
  },

  async saveLedger() {
    const name = document.getElementById('ledgerName').value.trim();
    const membersStr = document.getElementById('ledgerMembers').value.trim();
    if (!name) { App.toast('请输入账本名称'); return; }
    const members = membersStr ? membersStr.split(/[,，]/).map(s => s.trim()).filter(Boolean) : ['我'];
    if (members.length === 0) members.push('我');

    const ledger = {
      id: Utils.uid(),
      name,
      members,
      color: this._newLedgerColor || 0,
      createdAt: new Date().toISOString()
    };
    await DB.add('ledgers', ledger);
    await this.selectLedger(ledger.id);
    App.closeSheet();
    App.toast('账本已创建');
  },

  async removeLedger(id) {
    const ledgers = await DB.getAll('ledgers');
    if (ledgers.length <= 1) { App.toast('至少保留一个账本'); return; }
    App.confirm('删除账本将同时删除其所有记录，确定？', async () => {
      await DB.delete('ledgers', id);
      const txs = await DB.getByIndex('transactions', 'ledgerId', id);
      for (const t of txs) await DB.delete('transactions', t.id);
      this._txDirty = true; // 删账本连带删交易，失效交易缓存
      if (this.currentLedgerId === id) {
        this.currentLedgerId = ledgers.find(l => l.id !== id).id;
        await DB.setMeta('currentLedgerId', this.currentLedgerId);
      }
      App.toast('已删除');
      this.render();
    });
  },

  // ===== 成员管理 =====
  async showAddMember() {
    const html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">添加成员</div>
      <div class="form-group">
        <label class="form-label">成员名称</label>
        <input class="form-input" id="memberName" placeholder="输入名称">
      </div>
      <div class="action-row">
        <button class="btn btn-secondary" onclick="App.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="Finance.saveMember()">添加</button>
      </div>
    `;
    App.openSheet(html);
  },

  async showEditMember(idx) {
    const ledger = await this.getCurrentLedger();
    const name = ledger.members[idx];
    const html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">编辑成员</div>
      <div class="form-group">
        <label class="form-label">成员名称</label>
        <input class="form-input" id="memberName" value="${Utils.escape(name)}">
      </div>
      <div class="action-row">
        <button class="btn btn-secondary" onclick="App.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="Finance.saveMember(${idx})">保存</button>
      </div>
    `;
    App.openSheet(html);
  },

  async saveMember(editIdx) {
    const name = document.getElementById('memberName').value.trim();
    if (!name) { App.toast('请输入名称'); return; }
    const ledger = await this.getCurrentLedger();
    if (editIdx !== undefined) {
      ledger.members[editIdx] = name;
    } else {
      ledger.members.push(name);
    }
    await DB.put('ledgers', ledger);
    App.closeSheet();
    App.toast('已保存');
    this.render();
  },

  async removeMember(idx) {
    const ledger = await this.getCurrentLedger();
    if (ledger.members.length <= 1) { App.toast('至少保留一个成员'); return; }
    App.confirm(`确定删除成员"${ledger.members[idx]}"？相关账目可能受影响。`, async () => {
      ledger.members.splice(idx, 1);
      // 调整已有交易中的索引
      const txs = await DB.getByIndex('transactions', 'ledgerId', ledger.id);
      for (const tx of txs) {
        if (tx.payerIdx === idx) tx.payerIdx = 0;
        else if (tx.payerIdx > idx) tx.payerIdx--;
        tx.participantIdxs = tx.participantIdxs.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
        if (tx.splitRatios) {
          const newRatios = {};
          for (const [k, v] of Object.entries(tx.splitRatios)) {
            const ki = parseInt(k);
            if (ki === idx) continue;
            newRatios[ki > idx ? ki - 1 : ki] = v;
          }
          tx.splitRatios = newRatios;
        }
        await DB.put('transactions', tx);
      }
      await DB.put('ledgers', ledger);
      App.toast('已删除');
      this.render();
    });
  }
};

/* ============================================================
 *  打卡模块
 * ============================================================ */
const Habits = {
  habitIcons: ['💧','🏃','📚','💊','🌅','🧘','💪','✍️','🎸','🥗','😴','🚭','🦷','🧹','📞','💡','⌚','🛵'],
  habitColors: ['#74b9ff','#00cec9','#55efc4','#fdcb6e','#fab1a0','#fd79a8','#a29bfe','#dfe6e9'],

  // 按习惯名称固定图标（用户可自定义，但常用项默认显示更贴切的 emoji）
  iconByName: { '手表充电': '⌚', '电车充电': '🛵' },
  getIcon(h) { return this.iconByName[h.name] || h.icon || '✅'; },

  async init() {
    let habits = await DB.getAll('habits');

    // 自动修正指定习惯图标
    for (const h of habits) {
      const fixed = this.iconByName[h.name];
      if (fixed && h.icon !== fixed) {
        h.icon = fixed;
        await DB.put('habits', h);
      }
    }

    const defaults = [
      { name: '喝水', icon: '💧', color: 0, recordType: 'number', unit: '杯', target: 8 },
      { name: '跑步', icon: '🏃', color: 1, recordType: 'both', unit: '公里', target: null },
      { name: '阅读', icon: '📚', color: 2, recordType: 'text', unit: '', target: null },
      { name: '拉屎', icon: '💩', color: 1, recordType: 'text', unit: '', target: null },
    ];
    if (habits.length === 0) {
      // 全新安装：创建全部默认打卡项目
      for (const d of defaults) {
        await DB.add('habits', { id: Utils.uid(), ...d, createdAt: new Date().toISOString() });
      }
      await DB.setMeta('defaultHabitsAdded', true);
    } else {
      // 已初始化但可能缺默认项：补全一次（不覆盖用户自定义项）
      const added = await DB.getMeta('defaultHabitsAdded', false);
      if (!added) {
        const hasPoop = habits.some(h => h.name === '拉屎' || h.icon === '💩');
        if (!hasPoop) {
          await DB.add('habits', { id: Utils.uid(), name: '拉屎', icon: '💩', color: 1, recordType: 'text', unit: '', target: null, createdAt: new Date().toISOString() });
        }
        await DB.setMeta('defaultHabitsAdded', true);
      }
    }

    // 确保“奶茶”等常见打卡项存在（不覆盖用户自定义，刷新即获得）
    const hasMilk = habits.some(h => h.name === '奶茶' || h.icon === '🧋');
    if (!hasMilk) {
      await DB.add('habits', { id: Utils.uid(), name: '奶茶', icon: '🧋', color: 3, recordType: 'number', unit: '杯', target: null, createdAt: new Date().toISOString() });
    }

    // 确保“游泳”打卡项存在，并区分「游泳课程」与「日常游泳」（两个独立项，统计/趋势各自分开）
    const ensureHabits = [
      { name: '游泳课程', icon: '🏊', color: 4, recordType: 'both', unit: '课时', target: null },
      { name: '日常游泳', icon: '🏊', color: 5, recordType: 'both', unit: '分钟', target: null },
    ];
    for (const h of ensureHabits) {
      const exists = habits.some(x => x.name === h.name);
      if (!exists) {
        await DB.add('habits', { id: Utils.uid(), ...h, createdAt: new Date().toISOString() });
      }
    }
  },

  async render() {
    const habits = await DB.getAll('habits');
    const el = document.getElementById('habitsList');
    if (habits.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">✅</div><div class="text">还没有打卡项目，点击右上角 + 创建</div></div>`;
      return;
    }

    // 获取今日打卡（一次性拉全部打卡，按习惯分组，避免逐习惯发请求）
    const allCheckins = await DB.getAll('checkins');
    const checkinByHabit = {};
    for (const c of allCheckins) { (checkinByHabit[c.habitId] = checkinByHabit[c.habitId] || []).push(c); }
    const today = Utils.todayStr();
    let html = '';
    for (const h of habits) {
      const checkins = checkinByHabit[h.id] || [];
      const todayCheckins = checkins.filter(c => c.timestamp.slice(0, 10) === today);
      const done = todayCheckins.length > 0;
      const streak = this._calcStreak(checkins);

      let info = '';
      if (h.recordType === 'number' || h.recordType === 'both') {
        if (h.target) {
          const todayVal = todayCheckins.reduce((s, c) => s + (c.value || 0), 0);
          info = `今日 ${todayVal}/${h.target} ${h.unit || ''}`;
        } else {
          info = `今日 ${todayCheckins.reduce((s, c) => s + (c.value || 0), 0)} ${h.unit || ''}`;
        }
      } else {
        info = done ? '今日已打卡' : '今日未打卡';
      }

      html += `
        <div class="habit-card">
          <div class="hc-icon icon-bg-${h.color % 8}" onclick="Habits.showDetail('${h.id}')">${this.getIcon(h)}</div>
          <div class="hc-body" onclick="Habits.showDetail('${h.id}')">
            <div class="hc-name">${Utils.escape(h.name)}</div>
            <div class="hc-info">${info}</div>
            ${streak > 0 ? `<div class="hc-streak">🔥 连续 ${streak} 天</div>` : ''}
          </div>
          <div class="hc-actions">
            <div class="hc-btn ${done ? 'done' : ''}" onclick="Habits.${done ? 'cancelToday' : 'quickCheckin'}('${h.id}')" ${done ? 'title="点击取消今日打卡"' : ''}>${done ? '✓ 已打卡' : '打卡'}</div>
            <div class="hc-del" onclick="Habits.deleteHabit('${h.id}')" title="删除此打卡项">🗑</div>
          </div>
        </div>
      `;
    }
    el.innerHTML = html;
  },

  _calcStreak(checkins) {
    if (checkins.length === 0) return 0;
    const dates = [...new Set(checkins.map(c => c.timestamp.slice(0, 10)))].sort().reverse();
    if (dates.length === 0) return 0;
    let streak = 0;
    let checkDate = new Date();
    for (let i = 0; i < 365; i++) {
      const ds = checkDate.toISOString().slice(0, 10);
      if (dates.includes(ds)) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      } else if (i === 0) {
        // 今天没打卡，看昨天
        checkDate.setDate(checkDate.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  },

  // 默认一键打卡：不弹表单、不填数值/备注，直接记录一次
  async quickCheckin(habitId) {
    const habit = await DB.get('habits', habitId);
    if (!habit) return;
    const checkin = {
      id: Utils.uid(),
      habitId,
      value: null,
      note: '',
      timestamp: new Date().toISOString()
    };
    await DB.add('checkins', checkin);
    App.toast('打卡成功！');
    this.render();
    Home.render();
  },

  // 详细打卡：弹出表单补充数值/备注（点开详情页的「详细打卡」进入）
  async detailedCheckin(habitId) {

    if (!habit) return;

  _showCheckinForm(habit) {

    const isText = habit.recordType === 'text' || habit.recordType === 'both';

    const html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">${habit.icon} ${Utils.escape(habit.name)}</div>
      <div style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:16px">

          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="checkinNote" placeholder="写点什么..."></textarea>
        </div>

        <button class="btn btn-primary" onclick="Habits.saveCheckin('${habit.id}')">打卡</button>
      </div>

  },

  async saveCheckin(habitId) {

    const value = valueInput ? parseFloat(valueInput.value) : null;

    }

    const checkin = {
      id: Utils.uid(),
      habitId,
      value: value || null,
      note,
      timestamp: new Date().toISOString()
    };
    await DB.add('checkins', checkin);
    App.closeSheet();
    App.toast('打卡成功！');
    this.render();
    Home.render();
  },

  async deleteCheckin(checkinId, habitId) {

  // 取消今天的打卡（删除今天最近一次记录）
  async cancelToday(habitId) {
    const checkins = await DB.getByIndex('checkins', 'habitId', habitId);
    const today = Utils.todayStr();
    const todayC = checkins
      .filter(c => c.timestamp.slice(0, 10) === today)
      .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    if (todayC.length === 0) { App.toast('今天还没有打卡'); return; }
    App.confirm('取消今天的这次打卡？', async () => {
      await DB.delete('checkins', todayC[0].id);
      App.toast('已取消今日打卡');
      this.render();
      Home.render();

  async showDetail(habitId) {
    const habit = await DB.get('habits', habitId);
    if (!habit) return;
    const checkins = await DB.getByIndex('checkins', 'habitId', habitId);
    checkins.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    const streak = this._calcStreak(checkins);
    const total = checkins.length;

    let html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">${habit.icon} ${Utils.escape(habit.name)}</div>

      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-card" style="text-align:center">
          <div class="stat-label">连续打卡</div>
          <div class="stat-value" style="color:var(--orange)">🔥 ${streak}</div>
          <div class="stat-sub">天</div>
        </div>
        <div class="stat-card" style="text-align:center">
          <div class="stat-label">累计打卡</div>
          <div class="stat-value">${total}</div>

        </div>
      </div>
    `;

      html += `<div class="card"><div class="card-title">📋 打卡历史</div>`;
      const recent30 = checkins.slice(0, 30);
      for (const c of recent30) {
        let valStr = '';

          valStr = `<div class="ci-value">${c.value} ${habit.unit || ''}</div>`;
        }
        html += `
          <div class="checkin-item" style="cursor:pointer" onclick="Habits.deleteCheckin('${c.id}','${habit.id}')" title="点击撤销本次打卡">
            ${valStr}
            <div class="ci-note">${(c.note && c.note !== '补卡') ? Utils.escape(c.note) : '<span style="color:var(--text-light)">打卡</span>'}</div>
            <div style="text-align:right">
              <div class="ci-time">${Utils.formatDateTime(c.timestamp)}</div>
              <div style="font-size:11px;color:var(--danger);margin-top:2px">点击撤销</div>
            </div>
          </div>
        `;
      }
      html += `</div>`;
    }

    html += `
      <div class="action-row">
        <button class="btn btn-secondary" onclick="Habits.showEditHabit('${habit.id}')">编辑</button>
        <button class="btn btn-secondary" onclick="Habits.showBulkCheckin('${habit.id}')">批量补卡</button>

        <button class="btn btn-primary" onclick="App.closeSheet();setTimeout(()=>Habits.quickCheckin('${habit.id}'),300)">打卡</button>
      </div>

  },

  showBulkCheckin(habitId) {
    const now = new Date();
    this._bulkYear = now.getFullYear();
    this._bulkMonth = now.getMonth();
    this._bulkSel = new Set();
    const html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">📅 批量补打卡</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">在日历上点选要补卡的日期即可（已打卡的日期标 ✓，再点一下可取消选择）。点「确认补卡」一次性写入所有选中日期。</div>
      <div id="bulkCalBox"></div>
      <div class="form-group" style="margin-top:12px">
        <label class="form-label">或手动输入补充（每行/空格分隔，格式 月/日 如 5/12；留空则只用日历选择）</label>
        <textarea id="bulkDates" class="form-input" rows="3" style="width:100%;font-size:15px;line-height:1.6" placeholder="5/12 5/14 6/4 ..."></textarea>
      </div>
      <div class="action-row">
        <button class="btn btn-secondary" onclick="App.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="Habits.saveBulkCheckin('${habitId}')">确认补卡</button>
      </div>
    `;
    App.openSheet(html);
    this.renderBulkCalendar(habitId);
  },

  async renderBulkCalendar(habitId) {
    const year = this._bulkYear, month = this._bulkMonth;
    const existing = await DB.getByIndex('checkins', 'habitId', habitId);
    const existDays = new Set(existing.map(c => c.timestamp.slice(0, 10)));
    const startW = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();
    const today = Utils.todayStr();
    let cells = '';
    for (let i = 0; i < startW; i++) cells += '<div class="bulk-cell empty"></div>';
    for (let d = 1; d <= days; d++) {
      const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isEx = existDays.has(ds);
      const isSel = this._bulkSel.has(ds);
      const isToday = ds === today;
      const cls = 'bulk-cell' + (isSel ? ' sel' : '') + (isEx ? ' ex' : '') + (isToday ? ' today' : '');
      cells += `<div class="${cls}" onclick="Habits.toggleBulkDate('${habitId}','${ds}')">${d}${isEx ? '<span class="tick">✓</span>' : ''}</div>`;
    }
    const box = document.getElementById('bulkCalBox');
    if (!box) return;
    box.innerHTML = `
      <div class="bulk-cal-head">
        <button class="cal-nav" onclick="Habits.bulkMonthShift('${habitId}',-1)">‹</button>
        <span class="bulk-cal-title">${year}年${month + 1}月</span>
        <button class="cal-nav" onclick="Habits.bulkMonthShift('${habitId}',1)">›</button>
      </div>
      <div class="bulk-cal-grid">
        ${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="bulk-wd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="bulk-sel-info">已选 <b>${this._bulkSel.size}</b> 天${this._bulkSel.size ? `（${[...this._bulkSel].sort().join('、')}）` : ''}</div>
    `;
  },

  toggleBulkDate(habitId, ds) {
    if (this._bulkSel.has(ds)) this._bulkSel.delete(ds);
    else this._bulkSel.add(ds);
    this.renderBulkCalendar(habitId);
  },

  async bulkMonthShift(habitId, dir) {
    let m = this._bulkMonth + dir, y = this._bulkYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    this._bulkMonth = m; this._bulkYear = y;
    await this.renderBulkCalendar(habitId);
  },

  async saveBulkCheckin(habitId) {
    const habit = await DB.get('habits', habitId);
    const year = this._bulkYear || new Date().getFullYear();
    const existing = await DB.getByIndex('checkins', 'habitId', habitId);
    const existingDays = new Set(existing.map(c => c.timestamp.slice(0, 10)));
    let added = 0, skipped = 0, invalid = 0;
    const toAdd = [];
    // 1) 日历选中的日期
    for (const ds of this._bulkSel) {
      if (existingDays.has(ds)) { skipped++; continue; }
      const dt = new Date(ds + 'T12:00:00');
      if (isNaN(dt)) { invalid++; continue; }
      toAdd.push({ id: Utils.uid(), habitId, value: null, note: '', timestamp: dt.toISOString() });
      existingDays.add(ds); added++;
    }
    // 2) 文本框补充（格式 月/日）
    const raw = (document.getElementById('bulkDates') || {}).value || '';
    const tokens = raw.split(/[\s,，、]+/).filter(Boolean);
    for (const t of tokens) {
      const mm = t.trim().match(/^(\d{1,2})\/(\d{1,2})$/);
      if (!mm) { invalid++; continue; }
      const mo = parseInt(mm[1]), da = parseInt(mm[2]);
      const dt = new Date(year, mo - 1, da, 12, 0, 0);
      if (dt.getFullYear() !== year || dt.getMonth() !== mo - 1 || dt.getDate() !== da) { invalid++; continue; }
      const dayStr = `${year}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
      if (existingDays.has(dayStr)) { skipped++; continue; }
      toAdd.push({ id: Utils.uid(), habitId, value: null, note: '', timestamp: dt.toISOString() });
      existingDays.add(dayStr); added++;
    }
    for (const c of toAdd) await DB.add('checkins', c);
    this._bulkSel = new Set();
    App.closeSheet();
    let msg = `已补 ${added} 条`;
    if (skipped) msg += `，跳过 ${skipped} 条已存在`;
    if (invalid) msg += `，${invalid} 条格式有误`;
    App.toast(msg);
    this.render();
    Home.render();
    this.showDetail(habitId);
  },

  showAddHabit() {
    this._renderHabitForm(null);
  },

      <div class="form-group">

          ${this.habitIcons.map((icon, i) => `
            <div class="chip ${this.getIcon(h) === icon ? 'active' : ''}" onclick="App.selectChip(this,'habitIcon',${i})" data-icon="${icon}" style="font-size:18px;width:42px;height:42px;display:flex;align-items:center;justify-content:center">${icon}</div>
          `).join('')}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">颜色</label>
        <div class="chip-group">
          ${this.habitColors.map((c, i) => `
            <div class="chip ${h.color === i ? 'active' : ''}" onclick="App.selectChip(this,'habitColor',${i})" data-idx="${i}" style="${h.color===i?'background:'+c+';color:#fff':''}">
              <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${c}"></span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">记录类型</label>
        <div class="segment" style="margin-bottom:0">
          <div class="segment-item ${h.recordType==='number'?'active':''}" onclick="Habits.selectRecordType('number',this)">仅数值</div>
          <div class="segment-item ${h.recordType==='text'?'active':''}" onclick="Habits.selectRecordType('text',this)">仅文字</div>
          <div class="segment-item ${h.recordType==='both'?'active':''}" onclick="Habits.selectRecordType('both',this)">数值+文字</div>
        </div>
      </div>

      <div class="form-group" id="habitUnitGroup" style="display:${h.recordType==='text'?'none':'block'}">
        <label class="form-label">单位</label>
        <input class="form-input" id="habitUnit" value="${Utils.escape(h.unit||'')}" placeholder="如：杯、公里、分钟、页">
      </div>

      <div class="form-group" id="habitTargetGroup" style="display:${h.recordType==='text'?'none':'block'}">
        <label class="form-label">每日目标（可选）</label>
        <input class="form-input" type="number" id="habitTarget" value="${h.target||''}" placeholder="如：8（杯）" step="0.1">
      </div>

      <div class="action-row">
        ${isEdit ? `<button class="btn btn-danger" onclick="Habits.deleteHabit('${h.id}')">删除</button>` : ''}
        <button class="btn btn-secondary" onclick="App.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="Habits.saveHabit(${isEdit?`'${h.id}'`:'null'})">保存</button>
      </div>
    `;
    App.openSheet(html);
    this._habitForm = { icon: this.getIcon(h), color: h.color, recordType: h.recordType };
  },

  _habitForm: { icon: '✅', color: 0, recordType: 'both' },

  selectRecordType(type, el) {
    this._habitForm.recordType = type;
    el.parentElement.querySelectorAll('.segment-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('habitUnitGroup').style.display = type === 'text' ? 'none' : 'block';
    document.getElementById('habitTargetGroup').style.display = type === 'text' ? 'none' : 'block';
  },

  async saveHabit(editId) {
    const name = document.getElementById('habitName').value.trim();
    if (!name) { App.toast('请输入名称'); return; }
    const unit = document.getElementById('habitUnit')?.value.trim() || '';
    const targetVal = document.getElementById('habitTarget')?.value;
    const target = targetVal ? parseFloat(targetVal) : null;

    const habitData = {
      id: editId || Utils.uid(),
      name,
      icon: this._habitForm.icon,
      color: this._habitForm.color,
      recordType: this._habitForm.recordType,
      unit,
      target,
      createdAt: new Date().toISOString()
    };

    await DB.put('habits', habitData);
    App.closeSheet();
    App.toast(editId ? '已更新' : '已创建');
    this.render();
    Home.render();
  },

  async deleteHabit(id) {
    App.confirm('删除后打卡历史也会一并删除，确定？', async () => {
      await DB.delete('habits', id);
      const checkins = await DB.getByIndex('checkins', 'habitId', id);
      for (const c of checkins) await DB.delete('checkins', c.id);
      App.closeSheet();
      App.toast('已删除');
      this.render();
      Home.render();
    });
  }
};

/* ============================================================
 *  记事模块
 * ============================================================ */
const Notes = {
  filterCategory: null,
  defaultCategories: [
    { name: '工作', color: 4 },
    { name: '生活', color: 3 },
    { name: '想法', color: 2 },
    { name: '学习', color: 5 },
  ],

  async init() {
    let cats = await DB.getAll('categories');
    if (cats.length === 0) {
      for (let i = 0; i < this.defaultCategories.length; i++) {
        const d = this.defaultCategories[i];
        await DB.add('categories', { id: Utils.uid(), name: d.name, color: d.color, order: i });
      }
    }
  },

  async render() {
    const cats = await DB.getAll('categories');
    cats.sort((a, b) => (a.order||0) - (b.order||0));

    // 分类筛选
    const filterEl = document.getElementById('noteCatFilter');
    filterEl.innerHTML = `
      <div class="chip ${this.filterCategory === null ? 'active' : ''}" style="flex-shrink:0" onclick="Notes.setFilter(null)">全部</div>
      ${cats.map(c => `
        <div class="chip ${this.filterCategory === c.id ? 'active' : ''}" style="flex-shrink:0" onclick="Notes.setFilter('${c.id}')">${Utils.escape(c.name)}</div>
      `).join('')}
      <div class="chip" style="flex-shrink:0;color:var(--text-light)" onclick="Notes.showCategoryManage()">管理</div>
    `;

    // 搜索
    const search = document.getElementById('noteSearch').value.trim().toLowerCase();

    // 获取笔记
    let notes = await DB.getAll('notes');
    if (this.filterCategory) notes = notes.filter(n => n.categoryId === this.filterCategory);
    if (search) {
      notes = notes.filter(n =>
        (n.content || '').toLowerCase().includes(search) ||
        (n.tags || []).some(t => t.toLowerCase().includes(search))
      );
    }
    notes.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));

    const el = document.getElementById('notesList');
    if (notes.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📝</div><div class="text">${search ? '没有找到相关笔记' : '还没有笔记，点击右上角 + 记一条'}</div></div>`;
      return;
    }

    let html = '';
    for (const note of notes) {
      const cat = cats.find(c => c.id === note.categoryId);
      const catName = cat ? cat.name : '未分类';
      const catColor = cat ? cat.color : 7;
      const rawContent = note.content || '';
      const hasTitle = !!(note.title && note.title.trim());
      const clamped = !this._expanded.has(note.id);
      const showExpand = rawContent.length > 60;
      html += `
        <div class="note-card" onclick="Notes.toggleExpand('${note.id}', this.querySelector('.nc-content'), this.querySelector('.nc-expand'))">
          <div class="nc-header">
            <span class="nc-cat cat-color-${catColor}">${Utils.escape(catName)}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <span class="nc-time">${Utils.formatDateCN(note.updatedAt || note.createdAt)}</span>
              <span class="nc-edit" title="编辑" onclick="event.stopPropagation();Notes.showEditNote('${note.id}')">✎</span>
            </span>
          </div>
          ${hasTitle ? `<div class="nc-title">${Utils.escape(note.title.trim())}</div>` : ''}
          <div class="nc-content ${clamped ? 'clamp' : ''}">${Utils.escape(rawContent)}</div>
          ${showExpand ? `<span class="nc-expand">${clamped ? '展开全文' : '收起'}</span>` : ''}
          ${note.tags && note.tags.length > 0 ? `
            <div class="nc-tags">
              ${note.tags.map(t => `<span class="nc-tag">#${Utils.escape(t)}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }
    el.innerHTML = html;
  },

  _expanded: new Set(),

  toggleExpand(id, contentEl, linkEl) {
    if (!contentEl) return;
    if (this._expanded.has(id)) {
      this._expanded.delete(id);
      contentEl.classList.add('clamp');
      if (linkEl) linkEl.textContent = '展开全文';
    } else {
      this._expanded.add(id);
      contentEl.classList.remove('clamp');
      if (linkEl) linkEl.textContent = '收起';
    }
  },

  setFilter(catId) {
    this.filterCategory = catId;
    this.render();
  },

  showAddNote() {
    this._renderNoteForm(null);
  },

  async showEditNote(id) {
    const note = await DB.get('notes', id);
    this._renderNoteForm(note);
  },

  async _renderNoteForm(editNote) {
    const cats = await DB.getAll('categories');
    cats.sort((a, b) => (a.order||0) - (b.order||0));
    const isEdit = !!editNote;
    const n = editNote || { content: '', title: '', categoryId: cats[0]?.id || '', tags: [] };

    const html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">${isEdit ? '编辑笔记' : '新笔记'}</div>

      <div class="form-group">
        <label class="form-label">分类</label>
        <div class="chip-group">
          ${cats.map(c => `
            <div class="chip ${n.categoryId === c.id ? 'active' : ''}" onclick="App.selectChip(this,'noteCat','${c.id}')" data-id="${c.id}">${Utils.escape(c.name)}</div>
          `).join('')}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">标题</label>
        <input class="form-input" id="noteTitle" placeholder="标题（可选）" value="${Utils.escape(n.title || '')}">
      </div>

      <div class="form-group">
        <label class="form-label">内容</label>
        <textarea class="form-textarea" id="noteContent" placeholder="写下你的想法..." style="min-height:120px">${Utils.escape(n.content)}</textarea>
      </div>

      <div class="form-group">
        <label class="form-label">标签</label>
        <div class="tag-input-area" id="tagArea">
          ${(n.tags||[]).map(t => `
            <span class="tag-pill">#${Utils.escape(t)} <span class="remove" onclick="Notes.removeTag(this,'${Utils.escape(t)}')">×</span></span>
          `).join('')}
          <input type="text" id="tagInput" placeholder="输入标签后回车" onkeydown="Notes.onTagKeydown(event)">
        </div>
      </div>

      <div class="action-row">
        ${isEdit ? `<button class="btn btn-danger" onclick="Notes.deleteNote('${n.id}')">删除</button>` : ''}
        <button class="btn btn-secondary" onclick="App.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="Notes.saveNote(${isEdit?`'${n.id}'`:'null'})">保存</button>
      </div>
    `;
    App.openSheet(html);
    this._noteForm = { categoryId: n.categoryId, tags: [...(n.tags||[])] };
  },

  _noteForm: { categoryId: '', tags: [] },

  onTagKeydown(e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const input = e.target;
      const val = input.value.trim().replace(/^#/, '');
      if (val && !this._noteForm.tags.includes(val)) {
        this._noteForm.tags.push(val);
        input.value = '';
        this._refreshTags();
      }
    }
  },

  removeTag(el, tag) {
    this._noteForm.tags = this._noteForm.tags.filter(t => t !== tag);
    this._refreshTags();
  },

  _refreshTags() {
    const area = document.getElementById('tagArea');
    const input = document.getElementById('tagInput');
    const inputVal = input ? input.value : '';
    area.innerHTML = this._noteForm.tags.map(t => `
      <span class="tag-pill">#${Utils.escape(t)} <span class="remove" onclick="Notes.removeTag(this,'${Utils.escape(t)}')">×</span></span>
    `).join('') + `<input type="text" id="tagInput" placeholder="输入标签后回车" onkeydown="Notes.onTagKeydown(event)" value="${Utils.escape(inputVal)}">`;
    document.getElementById('tagInput').focus();
  },

  async saveNote(editId) {
    const content = document.getElementById('noteContent').value.trim();
    if (!content) { App.toast('请输入内容'); return; }
    const title = (document.getElementById('noteTitle').value || '').trim();

    const now = new Date().toISOString();
    const noteData = {
      id: editId || Utils.uid(),
      title,
      content,
      categoryId: this._noteForm.categoryId,
      tags: [...this._noteForm.tags],
      createdAt: editId ? (await DB.get('notes', editId)).createdAt : now,
      updatedAt: now
    };

    await DB.put('notes', noteData);
    App.closeSheet();
    App.toast(editId ? '已更新' : '已保存');
    this.render();
    Home.render();
  },

  async deleteNote(id) {
    App.confirm('确定删除这条笔记？', async () => {
      await DB.delete('notes', id);
      App.closeSheet();
      App.toast('已删除');
      this.render();
      Home.render();
    });
  },

  async showCategoryManage() {
    const cats = await DB.getAll('categories');
    cats.sort((a, b) => (a.order||0) - (b.order||0));

    let html = `
      <div class="sheet-handle"></div>
      <div class="sheet-title">分类管理</div>
      <div class="card">
        ${cats.map(c => `
          <div class="list-item">
            <div class="list-item-icon cat-color-${c.color}" style="border-radius:50%">●</div>
            <div class="list-item-content"><div class="list-item-title">${Utils.escape(c.name)}</div></div>
            <div class="list-item-right">
              <button class="btn btn-sm btn-danger" onclick="Notes.deleteCategory('${c.id}')">删除</button>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <div class="card-title">添加分类</div>
        <div class="form-group">
          <input class="form-input" id="newCatName" placeholder="分类名称">
        </div>
        <div class="form-group">
          <label class="form-label">颜色</label>
          <div class="chip-group" id="newCatColorGroup">
            ${[0,1,2,3,4,5,6,7].map(i => `
              <div class="chip ${i===0?'active':''}" onclick="App.selectChip(this,'catColor',${i})" data-idx="${i}" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px">
                <span class="cat-color-${i}" style="display:inline-block;width:18px;height:18px;border-radius:50%"></span>
              </div>
            `).join('')}
          </div>
        </div>
        <button class="btn btn-primary btn-block" onclick="Notes.addCategory()">添加</button>
      </div>
      <div class="action-row">
        <button class="btn btn-secondary" onclick="App.closeSheet();Notes.render()">完成</button>
      </div>
    `;
    this._newCatColor = 0;
    App.openSheet(html);
  },

  _newCatColor: 0,

  async addCategory() {
    const name = document.getElementById('newCatName').value.trim();
    if (!name) { App.toast('请输入名称'); return; }
    const cats = await DB.getAll('categories');
    await DB.add('categories', { id: Utils.uid(), name, color: this._newCatColor, order: cats.length });
    document.getElementById('newCatName').value = '';
    App.toast('已添加');
    this.showCategoryManage();
  },

  async deleteCategory(id) {
    const notes = await DB.getByIndex('notes', 'categoryId', id);
    if (notes.length > 0) {
      App.toast('该分类下有笔记，无法删除');
      return;
    }
    App.confirm('确定删除该分类？', async () => {
      await DB.delete('categories', id);
      App.toast('已删除');
      this.showCategoryManage();
    });
  }
};

/* ============================================================
 *  生活台首页
 * ============================================================ */
const Home = {
  async render() {
    // 日期
    const now = new Date();
    document.getElementById('homeDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${Utils.weekDay()}`;
    document.querySelector('.home-greeting').textContent = `${Utils.greeting()} 👋`;

    // 当前登录账号 / 模式
    const acctEl = document.getElementById('homeAccount');
    if (acctEl) {
      acctEl.textContent = DB.mode === 'cloud'
        ? `☁️ 已登录：${Auth.phone || ''}`
        : '📱 本地模式（未登录）';
    }

    // 统计卡片：聚合「全部账本」的本月支出（按本地年月判断，规避 toISOString 时区偏移导致的跨月误差）
    const txs = await DB.getAll('transactions');
    const now2 = new Date();
    const monthKey = `${now2.getFullYear()}-${String(now2.getMonth() + 1).padStart(2, '0')}`;
    const localYM = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
    const isExpense = (t) => !t.type || t.type !== 'income';
    const monthTx = txs.filter(t => localYM(t.date) === monthKey && isExpense(t));
    const monthTotal = monthTx.reduce((s, t) => s + Utils.txAmt(t), 0);

    const habits = await DB.getAll('habits');
    const allCheckins = await DB.getAll('checkins'); // 一次性拉全部打卡，避免逐习惯发请求
    const checkinByHabit = {};
    for (const c of allCheckins) { (checkinByHabit[c.habitId] = checkinByHabit[c.habitId] || []).push(c); }
    const today = Utils.todayStr();
    let habitDone = 0;
    for (const h of habits) {
      const cs = checkinByHabit[h.id] || [];
      if (cs.some(c => c.timestamp.slice(0, 10) === today)) habitDone++;
    }

    const notes = await DB.getAll('notes');

    document.getElementById('homeStats').innerHTML = `
      <div class="stat-card">
        <div class="stat-label">本月支出</div>
        <div class="stat-value">${Utils.formatMoney(monthTotal)}</div>
        <div class="stat-sub">全部账本 · ${monthTx.length}笔</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日打卡</div>
        <div class="stat-value">${habitDone}<span style="font-size:16px;color:var(--text-light)">/${habits.length}</span></div>
        <div class="stat-sub">${habits.length > 0 ? Math.round(habitDone/habits.length*100) + '% 完成' : '暂无项目'}</div>
      </div>
    `;

    // 日历数据聚合（跨月缓存，供切换月份复用）
    const calCheckins = [];
    for (const h of habits) {
      const cs = checkinByHabit[h.id] || [];
      for (const c of cs) calCheckins.push({ day: c.timestamp.slice(0, 10), icon: Habits.getIcon(h) });
    }
    const checkinByDay = {};
    for (const c of calCheckins) {
      (checkinByDay[c.day] = checkinByDay[c.day] || []).push(c.icon);
    }
    const spendByDay = {};
    const localDay = (iso) => { const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
    for (const t of txs) {
      const amt = Utils.txAmt(t);
      if (amt > 0) {
        const day = localDay(t.date);
        spendByDay[day] = (spendByDay[day] || 0) + amt;
      }
    }
    this._calCheckinMap = checkinByDay;
    this._calSpendMap = spendByDay;
    this._renderCalendar();

    // 最近记账：聚合所有账本，每条右上角标注所属账本（与总账单本视觉统一）
    const homeLedgers = await DB.getAll('ledgers');
    const homeLedgerMap = {};
    homeLedgers.forEach(l => homeLedgerMap[l.id] = l);
    const homeTx = (await DB.getAll('transactions'))
      .slice()
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .slice(0, 3);
    const financeEl = document.getElementById('homeFinance');
    if (homeTx.length === 0) {
      financeEl.innerHTML = `<div style="text-align:center;color:var(--text-light);padding:12px">暂无记录</div>`;
    } else {
      financeEl.innerHTML = homeTx.map(tx => {
        const hl = homeLedgerMap[tx.ledgerId];
        const ledgerName = hl ? hl.name : '未命名账本';
        const ledgerColor = hl ? Finance.ledgerColors[hl.color || 0] : '#636e72';
        const cat = Finance.txCategories[tx.categoryIdx] || Finance.txCategories[7];
        const payer = hl ? (hl.members[tx.payerIdx] || '?') : '?';
        const amtHtml = tx.amountUnknown ? `<span style="color:var(--warning)">未知</span>` : Utils.formatMoney(tx.amount);
        return `
          <div class="list-item">
            <div class="list-item-icon icon-bg-${cat.color}">${cat.icon}</div>
            <div class="list-item-content">
              <div class="list-item-title">${Utils.escape(tx.note || cat.name)}</div>
              <div class="list-item-sub">${Utils.escape(payer)} · ${Utils.formatDate(tx.date)}</div>
            </div>
            <div class="list-item-right">
              <div class="list-item-amount">${amtHtml}</div>
              <div class="ledger-badge" style="background:${ledgerColor}22;color:${ledgerColor}">📒 ${Utils.escape(ledgerName)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 最近记事
    const notesEl = document.getElementById('homeNotes');
    if (notes.length === 0) {
      notesEl.innerHTML = `<div style="text-align:center;color:var(--text-light);padding:12px">暂无笔记</div>`;
    } else {
      const cats = await DB.getAll('categories');
      const recent = notes.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt)).slice(0, 3);
      notesEl.innerHTML = recent.map(note => {
        const cat = cats.find(c => c.id === note.categoryId);
        const catName = cat ? cat.name : '未分类';
        const hasTitle = !!(note.title && note.title.trim());
        const dispTitle = hasTitle ? note.title.trim() : note.content.slice(0, 40);
        const ellipsis = (!hasTitle && note.content.length > 40) ? '...' : '';
        return `
          <div class="list-item" onclick="App.navigate('notes');setTimeout(()=>Notes.showEditNote('${note.id}'),300)">
            <div class="list-item-icon" style="background:var(--bg);font-size:18px">📝</div>
            <div class="list-item-content">
              <div class="list-item-title" style="font-size:14px">${Utils.escape(dispTitle)}${ellipsis}</div>
              <div class="list-item-sub">${Utils.escape(catName)} · ${Utils.formatDateCN(note.updatedAt || note.createdAt)}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  },

  prevMonth() {
    if (this._calMonth === undefined) return;
    this._calMonth--;
    if (this._calMonth < 0) { this._calMonth = 11; this._calYear--; }
    this._renderCalendar();
  },

  nextMonth() {
    if (this._calMonth === undefined) return;
    this._calMonth++;
    if (this._calMonth > 11) { this._calMonth = 0; this._calYear++; }
    this._renderCalendar();
  },

  _renderCalendar() {
    if (this._calYear === undefined) {
      const n = new Date();
      this._calYear = n.getFullYear();
      this._calMonth = n.getMonth();
    }
    const year = this._calYear, month = this._calMonth;
    const label = document.getElementById('calMonthLabel');
    if (label) label.textContent = year + '年' + (month + 1) + '月';

    const startWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = Utils.todayStr();
    const checkinByDay = this._calCheckinMap || {};
    const spendByDay = this._calSpendMap || {};

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    let html = '<div class="cal-grid">';
    html += weekdays.map(w => '<div class="cal-wd">' + w + '</div>').join('');
    for (let i = 0; i < startWeekday; i++) html += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const icons = checkinByDay[ds] || [];
      const spend = spendByDay[ds] || 0;
      const isToday = ds === todayStr;
      let marks = '';
      if (icons.length) {
        marks += '<div class="cal-icons">' + icons.slice(0, 5).map(ic => '<span class="cal-ic">' + ic + '</span>').join('') + (icons.length > 5 ? '<span class="cal-more">+' + (icons.length - 5) + '</span>' : '') + '</div>';
      }
      if (spend > 0) marks += '<div class="cal-spend">¥' + (Math.round(spend * 100) / 100).toFixed(0) + '</div>';
      html += '<div class="cal-cell' + (isToday ? ' today' : '') + '"><div class="cal-num">' + d + '</div>' + marks + '</div>';
    }
    html += '</div>';
    const container = document.getElementById('homeCalendar');
    if (container) container.innerHTML = html;
  },

  async openSettings() {
    App.openSettings();
  }
};

// ===== 账号模式：默认关闭「个人模式」，启动即展示登录/注册界面 =====
// 关闭个人模式 = 真正的多用户账号系统：可用手机号注册自己的账号、在任意设备登录同一账号同步数据。
// （如需回到「单一固定账号免登录」，把 PERSONAL_MODE 改回 true 并填好下方账号即可。）
const PERSONAL_MODE = false;
const PERSONAL_PHONE = '15989106650';
const PERSONAL_PWD = '123456';
const BUILD_VERSION = '1.3.9';

const App = {
  currentPage: 'home',

  async init() {
    const screen = document.getElementById('authScreen');
    const app = document.getElementById('app');
    // 双保险：通过 http(s) 打开时强制同源，避免 localStorage 残留的旧服务器地址把登录/读写请求发错地方
    if (!location.protocol.startsWith('file')) DB.apiBase = '';
    if (PERSONAL_MODE) {
      if (screen) screen.style.display = 'none';
      if (app) app.style.display = '';
    }
    // 进入登录/连接流程时先给出透明状态，避免冷启动期间白屏无反馈
    if (Auth.token || PERSONAL_MODE) this.updateConn('connecting', '正在连接云端…');
    if (Auth.token) {
      try {
        await Auth.verify();
        DB.setCloud(Auth.token);
        await this.ensureSeed();
        await this.boot();
        return;
      } catch (e) {
        Auth.clear();
      }
    }
    if (PERSONAL_MODE) { await this.autoLogin(); return; }
    this.showLogin();
  },

  // 个人模式：用内置账号自动登录（账号不存在则自动注册），失败则退回本地模式
  async autoLogin() {
    // 并发去重：多标签页/重复调用共享同一次登录，避免并发 register/login 造成会话冲突
    if (this._autoLoginPromise) return this._autoLoginPromise;
    this._autoLoginPromise = this._doAutoLogin();
    try { return await this._autoLoginPromise; }
    finally { this._autoLoginPromise = null; }
  },

  async _doAutoLogin() {
    const phone = PERSONAL_PHONE, pwd = PERSONAL_PWD;
    const maxRetry = 4;
    for (let attempt = 1; attempt <= maxRetry; attempt++) {
      this.updateConn('connecting', attempt > 1 ? `正在连接云端…（第 ${attempt} 次重试）` : '正在连接云端…');
      try {
        let r;
        try {
          r = await Auth.login(phone, pwd);
        } catch (le) {
          if (le && le.code === 'NO_ACCOUNT') {
            try {
              await Auth.register(phone, pwd);
            } catch (re) {
              // 并发下可能已被另一标签页注册（409）→ 忽略并转登录
              if (!(re && re.status === 409)) throw re;
            }
            r = await Auth.login(phone, pwd);
          } else {
            throw le;
          }
        }
        Auth.set(r.token, r.user.phone);
        DB.setCloud(r.token);
        await this.ensureSeed();
        await this.boot();
        this.maybeAutoMigrate();
        return;
      } catch (e) {
        console.warn('个人模式自动登录第 ' + attempt + ' 次失败：', e);
        if (attempt < maxRetry) {
          const wait = Math.min(1000 * Math.pow(2, attempt - 1), 4000);
          await new Promise(res => setTimeout(res, wait));
        }
      }
    }
    // 云端持续不可用（离线 / Render 冷启动超时）→ 退回本地模式，保证 App 能打开
    console.warn('个人模式自动登录失败，退回本地模式');
    Auth.clear();
    DB.setLocal();
    await this.boot();
    this.updateConn('local');
    this.toast('云端暂不可用，已用本地模式打开（数据仅存本设备）');
  },

  async boot() {
    await DB.init();
    await Finance.init();
    await Habits.init();
    await Notes.init();
    await Home.render();
    await Finance.render();
    await Habits.render();
    await Notes.render();
    const screen = document.getElementById('authScreen');
    const app = document.getElementById('app');
    if (screen) screen.style.display = 'none';
    if (app) app.style.display = '';
    this.updateConn(DB.mode === 'cloud' ? 'cloud' : 'local');
    this.registerSW();
    this.checkBuildVersion();
  },

  ensureSeed() {
    return fetch(apiUrl('/api/seed-defaults'), {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + Auth.token }
    }).catch(() => {});
  },

  showLogin() {
    if (PERSONAL_MODE) { this.autoLogin(); return; }
    const screen = document.getElementById('authScreen');
    const app = document.getElementById('app');
    if (screen) screen.style.display = 'flex';
    if (app) app.style.display = 'none';
    this._authMode = 'login';
    this.switchAuthTab('login');
  },

  switchAuthTab(mode) {
    this._authMode = mode;
    const tL = document.getElementById('authTabLogin');
    const tR = document.getElementById('authTabRegister');
    const hint = document.getElementById('authHint');
    const btn = document.querySelector('#authScreen .auth-btn');
    const errEl = document.getElementById('authError');
    if (tL) tL.classList.toggle('active', mode === 'login');
    if (tR) tR.classList.toggle('active', mode === 'register');
    if (hint) hint.textContent = mode === 'register'
      ? '注册后自动登录，数据仅属于该手机号'
      : '没有账号？切到「注册」先用手机号注册一个';
    if (btn) btn.textContent = mode === 'register' ? '注册并登录' : '登录';
    if (errEl) errEl.textContent = '';
  },

  async doAuth() {
    const phoneEl = document.getElementById('authPhone');
    const pwdEl = document.getElementById('authPwd');
    const btn = document.querySelector('#authScreen .auth-btn');
    const errEl = document.getElementById('authError');
    const phone = (phoneEl ? phoneEl.value : '').replace(/\D/g, '');
    const pwd = pwdEl ? pwdEl.value : '';
    if (phoneEl) phoneEl.value = phone;
    let err = '';
    if (!/^\d{6,20}$/.test(phone)) err = '请输入 6-20 位数字手机号';
    else if (!pwd || pwd.length < 4) err = '密码至少 4 位';
    if (err) {
      if (errEl) errEl.textContent = err;
      this.toast(err);
      return;
    }
    if (errEl) errEl.textContent = '';
    if (btn) { btn.disabled = true; btn.textContent = '登录中…'; }
    try {
      let r, autoRegistered = false;
      if (this._authMode === 'register') {
        r = await Auth.register(phone, pwd);
      } else {
        try {
          r = await Auth.login(phone, pwd);
        } catch (le) {
          // 云端账号不存在（多为实例重启后数据被清空）→ 自动注册后登录，避免「登录不了」
          if (le && le.code === 'NO_ACCOUNT') {
            await Auth.register(phone, pwd);
            r = await Auth.login(phone, pwd);
            autoRegistered = true;
          } else {
            throw le;
          }
        }
      }
      Auth.set(r.token, r.user.phone);
      DB.setCloud(r.token);
      await this.ensureSeed();
      await this.boot();
      this.toast(autoRegistered ? '账号已自动创建并登录' : (this._authMode === 'register' ? '注册成功，已登录' : '登录成功'));
      this.maybeAutoMigrate();
    } catch (e) {
      let msg = e.message || '操作失败，请确认服务端地址已填写且服务已启动';
      if (e.name === 'AbortError' || /超时|无法连接|连接服务器|SERVER_ERR/.test(msg)) {
        msg += '。建议刷新页面再试一次（Render 冷启动约 20 秒）';
      }
      if (errEl) errEl.textContent = msg;
      this.toast(msg);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = this._authMode === 'register' ? '注册并登录' : '登录'; }
    }
  },

  updateConn(status, detail) {
    const bar = document.getElementById('connBar');
    if (!bar) return;
    clearTimeout(this._connTimer);
    const oldBtn = bar.querySelector('.retry-btn');
    if (oldBtn) oldBtn.remove();
    bar.className = 'conn-bar show ' + status;
    const txt = bar.querySelector('.conn-text');
    if (status === 'cloud') {
      const t = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      txt.textContent = (detail || ('已同步云端 · ' + (Auth.phone || ''))) + ' · ' + t;
      this._connTimer = setTimeout(() => bar.classList.remove('show'), 3500);
      return;
    }
    if (status === 'local') {
      txt.textContent = detail || '本地模式 · 数据仅存本设备';
      return;
    }
    if (status === 'error') {
      txt.textContent = detail || '云端连接失败';
      const btn = document.createElement('button');
      btn.className = 'retry-btn';
      btn.textContent = '重试';
      btn.onclick = () => { this.autoLogin(); };

    if (location.protocol === 'file:') return;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (nw) nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              document.getElementById('swUpdate').classList.add('show');
            }
          });
        });

  // ===== CSV（Excel 兼容）导出 =====
  exportCsv() {
    (async () => {
      const txs = await DB.getAll('transactions');
      const habits = await DB.getAll('habits');
      const hMap = {}; habits.forEach(h => hMap[h.id] = h.name);
      const ledgers = await DB.getAll('ledgers');
      const lMap = {}; ledgers.forEach(l => lMap[l.id] = l.name);
      const cats = await DB.getAll('categories');
      const cMap = {}; cats.forEach(c => cMap[c.id] = c.name);
      const txHeader = ['日期', '类型', '金额', '账本', '分类', '备注', '是否清算'];
      const txRows = txs.map(t => [
        (t.date || '').slice(0, 10),
        t.type === 'income' ? '收入' : '支出',
        t.amountUnknown ? '未知' : (t.amount || 0),
        lMap[t.ledgerId] || '',
        cMap[t.categoryId] || '',
        (t.note || '').replace(/[,\n]/g, ' '),
        t.settlementId ? '已清算' : '未清算'
      ]);
      const checkins = await DB.getAll('checkins');
      const chHeader = ['日期', '打卡项', '备注'];
      const chRows = checkins.map(c => [
        (c.timestamp || '').slice(0, 10),
        hMap[c.habitId] || '',
        (c.note || '').replace(/[,\n]/g, ' ')
      ]);
      const toCsv = (h, rows) => '﻿' + [h.join(','), ...rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(','))].join('\r\n');
      const txCsv = toCsv(txHeader, txRows);
      const chCsv = toCsv(chHeader, chRows);
      const f1 = '生活台账目_' + Utils.todayStr() + '.csv';
      const f2 = '生活台打卡_' + Utils.todayStr() + '.csv';
      const b1 = new Blob([txCsv], { type: 'text/csv;charset=utf-8' });
      const b2 = new Blob([chCsv], { type: 'text/csv;charset=utf-8' });
      // 手机端优先用系统分享（可同时存两个文件/发微信），不支持再下载
      const files = [];
      try { files.push(new File([b1], f1, { type: 'text/csv' })); } catch (e) {}
      try { files.push(new File([b2], f2, { type: 'text/csv' })); } catch (e) {}
      if (files.length && typeof navigator !== 'undefined' && navigator.canShare && navigator.canShare({ files })) {
        try {
          await navigator.share({ files, title: '生活台 Excel 表', text: '账目与打卡 CSV' });
          this.toast('已调起系统分享，可存到「文件」或发微信');
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') { this.toast('已取消'); return; }
        }
      }
      // 微信内置浏览器：下载会被拦截，改为复制文本兜底
      const ua1 = (typeof navigator !== 'undefined' && navigator.userAgent || '').toLowerCase();
      if (/micromessenger/i.test(ua1)) {
        const combined = '===== 账目 ' + f1 + ' =====\n' + txCsv + '\n\n===== 打卡 ' + f2 + ' =====\n' + chCsv;
        App.showCopyModal('生活台数据.csv', combined);
        this.toast('已生成可复制文本，点「复制全部」存出来');
        return;
      }
      this._downloadFile(f1, txCsv, 'text/csv;charset=utf-8');
      this._downloadFile(f2, chCsv, 'text/csv;charset=utf-8');
      this.toast('已导出账目与打卡 Excel 表（CSV）');
    })();
  },
  _downloadFile(name, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },

    });

  // 优先用系统分享：手机可直接存到「文件」App / 微信 / 钉钉；不支持时回退浏览器下载
  async shareOrDownload(blob, filename, opts = {}) {
    let file = null;
    try { file = new File([blob], filename, { type: blob.type || 'application/octet-stream' }); }
    catch (e) { file = blob; }
    const canShare = typeof navigator !== 'undefined' && navigator.canShare &&
      (file instanceof Blob ? navigator.canShare({ files: [file] }) : false);
    if (canShare) {
      try {
        await navigator.share({
          files: [file],
          title: opts.title || '生活台数据',
          text: opts.text || '生活台数据备份'
        });
        return 'shared';
      } catch (e) {
        if (e && e.name === 'AbortError') return 'cancelled'; // 用户取消分享
        // 分享失败，继续走下载兜底
      }
    }
    // 微信内置浏览器：下载会被拦截，改为显示文本供复制
    const ua0 = (typeof navigator !== 'undefined' && navigator.userAgent || '').toLowerCase();
    if (/micromessenger/i.test(ua0)) {
      let content = (typeof opts.text === 'string') ? opts.text : null;
      if (content == null) { try { content = await blob.text(); } catch (e) { content = ''; } }
      App.showCopyModal(filename, content);
      return 'copy';
    }
    // 其他：浏览器下载
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'downloaded';
  },

  // 微信等不支持分享/下载的环境：弹窗显示全部内容，可一键复制或长按复制
  showCopyModal(filename, content) {
    const html = `
      <div id="copyOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px">
        <div style="background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden">
          <div style="padding:14px 16px;border-bottom:1px solid #eee">
            <div style="font-size:15px;font-weight:600">导出内容已生成</div>
            <div style="font-size:12px;color:#888;margin-top:4px">当前为微信内置浏览器，无法存文件。请「复制全部」后粘贴到「文件传输助手」/ 邮件保存；或在右上角 ··· 用 Safari/Chrome 打开本页后再导出为文件。</div>
          </div>
          <textarea id="copyText" readonly style="flex:1;min-height:240px;margin:0;border:0;padding:12px;font-family:monospace;font-size:11px;line-height:1.5;resize:none;box-sizing:border-box;word-break:break-all;background:#fafafa"></textarea>
          <div style="display:flex;gap:10px;padding:12px 16px;border-top:1px solid #eee">
            <button class="btn btn-primary" style="flex:1" onclick="App.copyExportText()">复制全部</button>
            <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('copyOverlay').remove()">关闭</button>
          </div>
        </div>
      </div>`;
    const old = document.getElementById('copyOverlay'); if (old) old.remove();
    document.body.insertAdjacentHTML('beforeend', html);
    const ta = document.getElementById('copyText'); if (ta) ta.value = (content == null ? '' : String(content));
  },

  async copyExportText() {
    const ta = document.getElementById('copyText');
    if (!ta) return;
    const text = ta.value;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        App.toast('已复制，去粘贴到文件传输助手/邮件保存');
        return;
      }
    } catch (e) {}
    ta.focus(); ta.select();
    try { document.execCommand('copy'); App.toast('已复制，去粘贴到文件传输助手/邮件保存'); }
    catch (e) { App.toast('请长按文本框手动全选复制'); }
  },

  async exportData() {
    let data;
    if (DB.mode === 'cloud') {
      // 云端走 /api/export 拿完整数据（含照片 base64，列表接口已剥离 photo 以提速）
      const r = await DB._api('GET', '/api/export');
      const d = (r && r.data) ? r.data : {};
      data = {
        version: 1,
        exportDate: new Date().toISOString(),
        ledgers: d.ledgers || [],
        transactions: d.transactions || [],
        habits: d.habits || [],
        checkins: d.checkins || [],
        categories: d.categories || [],
        notes: d.notes || [],
        meta: (d.meta && typeof d.meta === 'object' && !Array.isArray(d.meta))
          ? Object.entries(d.meta).map(([key, value]) => ({ key, value }))
          : (d.meta || []),
      };
    } else {
      data = {
        version: 1,
        exportDate: new Date().toISOString(),
        ledgers: await DB.getAll('ledgers'),
        transactions: await DB.getAll('transactions'),
        habits: await DB.getAll('habits'),
        checkins: await DB.getAll('checkins'),
        categories: await DB.getAll('categories'),
        notes: await DB.getAll('notes'),
        meta: await DB.getAll('meta'),
      };
    }
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const filename = `生活台备份_${Utils.todayStr()}.json`;
    const res = await App.shareOrDownload(blob, filename, { title: '生活台数据备份', text: jsonStr });
    if (res === 'shared') App.toast('已调起系统分享，可存到「文件」或发微信');
    else if (res === 'cancelled') App.toast('已取消');
    else if (res === 'copy') App.toast('已生成可复制文本，点「复制全部」存出来');
    else App.toast('已导出（浏览器下载）');
  },

  importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.version) { App.toast('文件格式不对'); return; }

        App.confirm('导入将合并到现有数据：相同 ID 的条目被更新，云端独有的保留。确定？', async () => {
          const stores = ['ledgers','transactions','habits','checkins','categories','notes','meta'];
          for (const store of stores) {
            if (data[store] && Array.isArray(data[store])) {
              for (const item of data[store]) {
                await DB.put(store, item);
              }
            }
          }
          if (data.meta && !Array.isArray(data.meta)) {
            for (const k in data.meta) await DB.put('meta', { key: k, value: data.meta[k] });
          }
          App.toast('导入成功（已合并到现有数据）');
          App.closeSheet();
          await Finance.init();
          await Home.render();
          await Finance.render();
          await Habits.render();
          await Notes.render();
        });
      } catch (err) {
        App.toast('导入失败：' + err.message);
      }
    };
    input.click();
  },

  // ===== 云端服务器地址 =====
  setApiBase(v) {
    DB.setApiBase(v);
    if (DB.apiBase) {
      Auth.clear(); DB.setLocal();
    }
    App.toast(DB.apiBase ? '已保存服务器地址（请重新登录）' : '已改为同源模式');
  },

  // ===== 读取本机 IndexedDB（与当前模式无关）=====
  async readLocalAll() {
    const stores = ['ledgers', 'transactions', 'habits', 'checkins', 'categories', 'notes', 'settlements', 'meta'];
    const db = await new Promise((res, rej) => {
      const r = indexedDB.open(DB.DB_NAME, DB.DB_VERSION);
      r.onsuccess = e => res(e.target.result);
      r.onerror = e => rej(e.target.error);
    });
    const result = {};
    for (const s of stores) {
      result[s] = await new Promise((res) => {
        try {
          const tx = db.transaction(s, 'readonly');
          const req = tx.objectStore(s).getAll();
          req.onsuccess = () => res(req.result || []);
          req.onerror = () => res([]);
        } catch (e) { res([]); }
      });
    }
    db.close();
    return result;
  },

  // ===== 登录后若发现本机有历史数据，自动提示一次性迁移 =====
  async maybeAutoMigrate() {
    if (PERSONAL_MODE) return; // 个人模式=单一固定云端账号，本地 IndexedDB 是无关残留，禁用自动覆盖以免破坏云端数据
    try {
      const local = await App.readLocalAll();
      const total = ['habits', 'checkins', 'transactions', 'notes', 'ledgers']
        .reduce((a, s) => a + (local[s] || []).length, 0);
      if (!total) return;
      const flag = 'wb_migrated_' + (Auth.phone || '');
      try { if (localStorage.getItem(flag)) return; } catch (e) {}
      const n = (s) => (local[s] || []).length;
      const summary = `打卡项 ${n('habits')} · 打卡记录 ${n('checkins')} · 记账 ${n('transactions')} · 笔记 ${n('notes')} · 账本 ${n('ledgers')}`;
      App.confirm(`发现本机有历史数据，是否迁移到云端账号 ${Auth.phone}？\n（${summary}）`, async () => {
        await App.migrateToCloud(true);
        try { localStorage.setItem(flag, '1'); } catch (e) {}
      });
    } catch (e) {}
  },

  // ===== 把本机数据迁移/覆盖到已登录的云端账号 =====
  async migrateToCloud(skipConfirm) {
    if (!Auth.token) {
      App.toast('请先在登录界面登录云端账号');
      App.showLogin();
      return;
    }
    if (PERSONAL_MODE) { App.toast('个人模式数据已实时存于云端，无需从本机迁移'); return; }
    const local = await App.readLocalAll();
    const n = (s) => (local[s] || []).length;
    const summary = `打卡项 ${n('habits')} · 打卡记录 ${n('checkins')} · 记账 ${n('transactions')} · 笔记 ${n('notes')} · 账本 ${n('ledgers')}`;
    const doMigrate = async () => {
      App.toast('正在迁移…');
      try {
        const metaObj = {};
        (local.meta || []).forEach(m => { if (m && m.key != null) metaObj[m.key] = m.value; });
        const payload = {
          ledgers: local.ledgers || [],
          transactions: local.transactions || [],
          habits: local.habits || [],
          checkins: local.checkins || [],
          categories: local.categories || [],
          notes: local.notes || [],
          settlements: local.settlements || [],
          meta: metaObj
        };
        const base = (DB.apiBase || '').replace(/\/$/, '');
        const resp = await fetch(base + '/api/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + Auth.token },
          body: JSON.stringify({ data: payload })
        });
        if (!resp.ok) {
          const e = await resp.json().catch(() => ({}));
          throw new Error(e.error || '迁移失败');
        }
        App.toast('迁移成功，正在刷新…');
        setTimeout(() => location.reload(), 900);
      } catch (e) {
        App.toast('迁移失败：' + e.message);
      }
    };
    if (skipConfirm) { await doMigrate(); return; }
    App.confirm(`将把本机全部数据覆盖到云端账号 ${Auth.phone}，确定？\n（${summary}）`, doMigrate);
  },

  clearData() {
    App.confirm('⚠️ 此操作将清空所有数据且不可恢复，确定？', async () => {
      await DB.clearAll();
      App.toast('已清空');
      App.closeSheet();
      location.reload();
    });
  }
};

// ===== 启动 =====
App.init();
</script>

  <div class="auth-title">我的生活台</div>
  <div class="auth-sub">登录账号后，手机 / 电脑可同步同一份数据</div>
  <div class="auth-sub" style="font-size:12px;margin-top:6px;opacity:.85">云端地址：https://workbench-server-bpps.onrender.com</div>
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" id="authTabLogin" onclick="App.switchAuthTab('login')">登录</div>
      <div class="auth-tab" id="authTabRegister" onclick="App.switchAuthTab('register')">注册</div>
    </div>
    <input class="auth-input" id="authPhone" type="tel" inputmode="numeric" placeholder="手机号">
    <input class="auth-input" id="authPwd" type="password" placeholder="密码（至少 4 位）">
    <button class="auth-btn" onclick="App.doAuth()">登录</button>
    <div class="auth-error" id="authError"></div>
    <div class="auth-hint" id="authHint">没有账号？切到「注册」先用手机号注册一个即可</div>
  </div>
  <div class="auth-local" onclick="App.useLocalMode()">仅本机使用（不同步云端）</div>
</div>
