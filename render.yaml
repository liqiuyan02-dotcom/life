# Render.com 部署配置（免费 Web 服务 + 免费 PostgreSQL）
# 用法：把整个 server/ 目录推到 GitHub 仓库，在 Render 新建 "Blueprint" 并连接该仓库即可。
# Render 会自动创建下方声明的免费 Postgres，并把 DATABASE_URL 注入到 Web 服务。
# PostgreSQL 在免费实例上可持久保存数据（跨重启/重新部署不丢失），90 天后需续期或升级。
services:
  - type: web
    name: workbench-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: workbench-db
          property: connectionString
databases:
  - name: workbench-db
    plan: free
    region: oregon
    databaseName: workbench
    user: workbench
    # 免费 Postgres 90 天后过期；如需长期使用可在 Render 后台升级为付费实例。
